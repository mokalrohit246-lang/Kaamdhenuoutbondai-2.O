version: '3.8'

services:
  outbound-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: outbound-ai:latest
    container_name: outbound-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ── LiveKit Cloud ──
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

      # ── Google Gemini AI ──
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-live-preview}
      - GEMINI_TTS_VOICE=${GEMINI_TTS_VOICE:-Aoede}
      - USE_GEMINI_REALTIME=${USE_GEMINI_REALTIME:-true}

      # ── Vobiz SIP Telephony ──
      - VOBIZ_SIP_DOMAIN=${VOBIZ_SIP_DOMAIN}
      - VOBIZ_USERNAME=${VOBIZ_USERNAME}
      - VOBIZ_PASSWORD=${VOBIZ_PASSWORD}
      - VOBIZ_OUTBOUND_NUMBER=${VOBIZ_OUTBOUND_NUMBER}
      - OUTBOUND_TRUNK_ID=${OUTBOUND_TRUNK_ID}
      - DEFAULT_TRANSFER_NUMBER=${DEFAULT_TRANSFER_NUMBER}

      # ── Supabase ──
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # ── Twilio SMS & WhatsApp ──
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - TWILIO_WA_SID=${TWILIO_WA_SID}
      - TWILIO_WA_TOKEN=${TWILIO_WA_TOKEN}
      - TWILIO_WA_FROM=${TWILIO_WA_FROM}

      # ── Cal.com (Optional) ──
      - CALCOM_API_KEY=${CALCOM_API_KEY}
      - CALCOM_EVENT_TYPE_ID=${CALCOM_EVENT_TYPE_ID}
      - CALCOM_TIMEZONE=${CALCOM_TIMEZONE:-Asia/Kolkata}

      # ── S3 / Supabase Storage (Optional) ──
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_REGION=${S3_REGION:-ap-northeast-1}
      - S3_BUCKET=${S3_BUCKET}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
